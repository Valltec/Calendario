<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Turnos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Kalam:wght@400;700&display=swap');

:root{
  --board: #F3F0E8;
  --cell: #FFFFFF;
  --band: #1C1C22;
  --weekend-bg: #F5C518;
  --ink: #1C1C22;
  --muted: #8A8779;
  --line: #E4E0D3;
  --gold: #F5C518;
  --red: #C0392B;
  --s1: #F4A340;
  --s1-ink: #6b3d05;
  --s2: #7FD8C4;
  --s2-ink: #0d4a3f;
  --s3: #F2A6C5;
  --s3-ink: #6b1f42;
  --s4: #B9AEDD;
  --s4-ink: #3a2a63;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background: var(--board);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
  padding: 28px 20px 70px;
}

.wrap{
  max-width: 980px;
  margin: 0 auto;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 22px;
}

.badge{
  background: var(--band);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 15px;
  padding: 12px 22px;
  border-radius: 999px;
  display:inline-block;
}

.sub{
  color: var(--muted);
  font-size: 13.5px;
  margin: 8px 0 0 4px;
  max-width: 50ch;
}

.nav{
  display:flex;
  align-items:center;
  gap: 14px;
  font-family:'Poppins', sans-serif;
}

.nav button{
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: #fff;
  font-size: 16px;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.15s ease, transform 0.15s ease;
}
.nav button:hover{ background: var(--gold); transform: translateY(-1px); }
.nav button:disabled{ opacity: 0.35; cursor: default; transform:none; }

.nav h2{
  font-size: 19px;
  font-weight: 600;
  margin: 0;
  min-width: 168px;
  text-align:center;
  text-transform: capitalize;
}

.board-frame{
  background: var(--cell);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 22px 50px -28px rgba(0,0,0,0.35);
  border: 1px solid var(--line);
}

.weekday-row{
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--cell);
  border-bottom: 1.5px solid var(--line);
}

.weekday-row div{
  padding: 10px 8px;
  font-family:'Poppins', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  text-align:center;
  color: var(--muted);
  border-right: 1px solid var(--line);
}
.weekday-row div:last-child{ border-right:none; }
.weekday-row div.weekend{
  background: var(--weekend-bg);
  color: var(--ink);
}

.day-grid{
  display:grid;
  grid-template-columns: repeat(7, 1fr);
}

.day-cell{
  min-height: 148px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 8px;
  position: relative;
  cursor: pointer;
  transition: background 0.12s ease;
  background: var(--cell);
}
.day-cell:nth-child(7n){ border-right:none; }
.day-cell.blank{ cursor:default; background: #FAF9F5; }
.day-cell.weekend{ background: #FBF6DC; cursor: default; }
.day-cell.past{ opacity: 0.45; cursor: default; }
.day-cell:not(.blank):not(.weekend):not(.past):hover{ background: #FCF8EC; }
.day-cell.selected{ outline: 2.5px solid var(--ink); outline-offset: -2.5px; }
.day-cell.today .day-num{
  background: var(--ink);
  color: #fff;
  border-radius: 50%;
}

.day-num{
  font-family:'Poppins', sans-serif;
  font-size: 12px;
  font-weight: 600;
  width: 22px; height: 22px;
  display:flex; align-items:center; justify-content:center;
  color: var(--ink);
}

.chips{
  margin-top: 6px;
  display:flex;
  flex-direction:column;
  gap: 4px;
}

.chip{
  font-family: 'Kalam', cursive;
  font-size: 12.5px;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 4px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 3px 6px -3px rgba(0,0,0,0.35);
}
.chip.s1{ background: var(--s1); color: var(--s1-ink); transform: rotate(-1.2deg); }
.chip.s2{ background: var(--s2); color: var(--s2-ink); transform: rotate(1deg); }
.chip.s3{ background: var(--s3); color: var(--s3-ink); transform: rotate(-0.8deg); }
.chip.s4{ background: var(--s4); color: var(--s4-ink); transform: rotate(1.1deg); }

.composer{
  margin-top: 22px;
  display:none;
}
.composer.show{ display:block; }

.sticky{
  background: var(--gold);
  border-radius: 6px;
  padding: 22px 26px;
  box-shadow: 0 20px 40px -22px rgba(0,0,0,0.45);
  position: relative;
  transform: rotate(-0.4deg);
}

.sticky-head{
  display:flex;
  align-items:flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.sticky-head h3{
  font-family:'Poppins', sans-serif;
  font-size: 18px;
  margin: 0;
  text-transform: capitalize;
}

.close-btn{
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--ink);
  line-height:1;
  padding: 4px;
}

.slot-line{
  display:flex;
  align-items:center;
  gap: 14px;
  background: rgba(255,255,255,0.55);
  border-radius: 5px;
  padding: 12px 14px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.slot-line:last-child{ margin-bottom:0; }

.slot-time{
  font-family:'Poppins', sans-serif;
  font-weight: 600;
  font-size: 14.5px;
  min-width: 96px;
}

.slot-body{
  flex:1;
  display:flex;
  align-items:center;
  gap: 10px;
  min-width: 200px;
  flex-wrap: wrap;
}

.taken-tag{
  font-family:'Kalam', cursive;
  font-weight: 700;
  font-size: 14.5px;
}

.name-form{
  display:flex;
  gap: 8px;
  flex: 1;
  min-width: 220px;
}

.name-form input[type="text"]{
  font-family:'Inter';
  font-size: 13.5px;
  padding: 8px 10px;
  border-radius: 4px;
  border: 1.5px solid rgba(0,0,0,0.15);
  background: #fff;
  flex:1;
  min-width: 0;
}
.name-form input[type="text"]:focus{ outline: 2px solid var(--ink); }
.name-form input[type="text"].input-taken{
  background: #E4E0D3;
  color: var(--muted);
  cursor: not-allowed;
}

.btn.btn-cancel{
  background: transparent;
  color: var(--red);
  border: 1.5px solid var(--red);
}
.btn.btn-cancel:hover{ background: rgba(192,57,43,0.08); }

.btn{
  font-family:'Poppins', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--band);
  color: #fff;
  border: none;
  padding: 8px 15px;
  border-radius: 4px;
  cursor:pointer;
  white-space: nowrap;
  transition: transform 0.12s ease;
}
.btn:hover{ transform: translateY(-1px); }
.btn:disabled{ opacity: 0.55; cursor: default; transform:none; }

.notice{
  font-size: 13px;
  color: var(--red);
  margin-top: 12px;
  display:none;
}
.notice.show{display:block;}

.footer-note{
  margin-top: 26px;
  font-size: 12px;
  color: var(--muted);
  text-align:center;
}

.loading-row{
  padding: 30px;
  text-align:center;
  color: var(--muted);
  font-family:'Poppins', sans-serif;
  font-size: 13.5px;
  grid-column: 1 / -1;
}

@media (max-width: 640px){
  .weekday-row div{ font-size: 10.5px; padding: 8px 3px; }
  .day-cell{ min-height: 118px; padding: 5px; }
  .chip{ font-size: 10.5px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="badge">Agenda de turnos</div>
      <p class="sub">Tocá un día de lunes a viernes para reservar 16:00–17:00, 17:00–18:00, 19:00–20:00 o 20:00–21:00.</p>
    </div>
    <div class="nav">
      <button id="prevBtn" aria-label="Mes anterior">‹</button>
      <h2 id="monthLabel"></h2>
      <button id="nextBtn" aria-label="Mes siguiente">›</button>
    </div>
  </div>

  <div class="board-frame">
    <div class="weekday-row" id="weekdayRow"></div>
    <div class="day-grid" id="dayGrid">
      <div class="loading-row">Cargando el tablero…</div>
    </div>
  </div>

  <div class="composer" id="composer">
    <div class="sticky">
      <div class="sticky-head">
        <h3 id="composerTitle"></h3>
        <button class="close-btn" id="closeComposer" aria-label="Cerrar">✕</button>
      </div>
      <div id="composerSlots"></div>
      <p class="notice" id="composerNotice"></p>
    </div>
  </div>

  <p class="footer-note">Agenda compartida: todas las personas que la abran ven y reservan los mismos turnos.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── Configuración de Supabase ──────────────────────────────────────
// Pegá acá la URL de tu proyecto y la anon public key
// (Supabase → Settings → API). Instrucciones completas al pie del chat.
const SUPABASE_URL = 'https://gubuxugmvwduyesipygk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_W38dTjnNptY5JYpxSrul-Q_HTSE3bFY';

const supabaseClient = (SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 10)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
// ────────────────────────────────────────────────────────────────────

const weekdayRow = document.getElementById('weekdayRow');
const dayGrid = document.getElementById('dayGrid');
const monthLabel = document.getElementById('monthLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const composer = document.getElementById('composer');
const composerTitle = document.getElementById('composerTitle');
const composerSlots = document.getElementById('composerSlots');
const composerNotice = document.getElementById('composerNotice');
const closeComposer = document.getElementById('closeComposer');

const WEEKDAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const SLOTS = [
  {hour:16, label:'16:00–17:00', cls:'s1'},
  {hour:17, label:'17:00–18:00', cls:'s2'},
  {hour:19, label:'19:00–20:00', cls:'s3'},
  {hour:20, label:'20:00–21:00', cls:'s4'}
];

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
let monthData = {};
let selectedISO = null;

function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayISO(){ return isoOf(now.getFullYear(), now.getMonth(), now.getDate()); }
function monthKey(y,m){ return `${y}-${pad(m+1)}`; }
function jsWeekday(y,m,d){
  const wd = new Date(y,m,d).getDay();
  return wd === 0 ? 6 : wd - 1;
}

function buildWeekdayRow(){
  weekdayRow.innerHTML = '';
  WEEKDAYS.forEach((name, i) => {
    const div = document.createElement('div');
    div.textContent = name;
    if(i >= 5) div.classList.add('weekend');
    weekdayRow.appendChild(div);
  });
}
buildWeekdayRow();

async function fetchMonthObj(year, month){
  if(!supabaseClient) return {};
  const first = isoOf(year, month, 1);
  const last = isoOf(year, month, new Date(year, month+1, 0).getDate());
  try{
    const { data, error } = await supabaseClient
      .from('bookings')
      .select('date, hour, name')
      .gte('date', first)
      .lte('date', last);
    if(error){ console.error(error); return {}; }
    const obj = {};
    (data || []).forEach(row => {
      if(!obj[row.date]) obj[row.date] = {};
      obj[row.date][row.hour] = { name: row.name };
    });
    return obj;
  }catch(err){
    console.error(err);
    return {};
  }
}

async function loadMonth(){
  dayGrid.innerHTML = '<div class="loading-row">Cargando el tablero…</div>';
  monthData = await fetchMonthObj(viewYear, viewMonth);
  renderMonth();
}

function renderMonth(){
  monthLabel.textContent = `${MONTHS[viewMonth]} ${viewYear}`;
  dayGrid.innerHTML = '';

  const firstWeekday = jsWeekday(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  for(let i=0; i<firstWeekday; i++){
    const blank = document.createElement('div');
    blank.className = 'day-cell blank';
    dayGrid.appendChild(blank);
  }

  for(let d=1; d<=daysInMonth; d++){
    const iso = isoOf(viewYear, viewMonth, d);
    const wd = jsWeekday(viewYear, viewMonth, d);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if(wd >= 5) cell.classList.add('weekend');
    if(iso < todayISO()) cell.classList.add('past');
    if(iso === todayISO()) cell.classList.add('today');
    if(iso === selectedISO) cell.classList.add('selected');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);

    const dayBookings = monthData[iso];
    if(dayBookings){
      const chips = document.createElement('div');
      chips.className = 'chips';
      SLOTS.forEach(s => {
        const b = dayBookings[s.hour];
        if(b && b.name){
          const chip = document.createElement('div');
          chip.className = `chip ${s.cls}`;
          chip.textContent = `${s.hour}h ${b.name}`;
          chips.appendChild(chip);
        }
      });
      cell.appendChild(chips);
    }

    if(wd < 5 && iso >= todayISO()){
      cell.addEventListener('click', () => openComposer(iso));
    }

    dayGrid.appendChild(cell);
  }
}

function formatLong(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const wd = jsWeekday(y, m-1, d);
  return `${WEEKDAYS[wd]} ${d} de ${MONTHS[m-1].toLowerCase()}`;
}

function openComposer(iso){
  selectedISO = iso;
  composerTitle.textContent = formatLong(iso);
  composerNotice.classList.remove('show');
  composer.classList.add('show');
  renderComposerSlots();
  renderMonth();
  composer.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderComposerSlots(){
  composerSlots.innerHTML = '';
  const dayBookings = monthData[selectedISO] || {};

  SLOTS.forEach(s => {
    const line = document.createElement('div');
    line.className = 'slot-line';

    const time = document.createElement('div');
    time.className = 'slot-time';
    time.textContent = s.label;
    line.appendChild(time);

    const body = document.createElement('div');
    body.className = 'slot-body';

    const booking = dayBookings[s.hour];
    const isTaken = !!(booking && booking.name);

    const form = document.createElement('form');
    form.className = 'name-form';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Tu nombre';
    input.maxLength = 60;
    input.setAttribute('aria-label', `Nombre para el turno de ${s.hour}:00`);
    if(isTaken){
      input.value = booking.name;
      input.disabled = true;
      input.classList.add('input-taken');
    } else {
      input.required = true;
    }

    const btn = document.createElement('button');
    btn.type = 'submit';
    btn.className = isTaken ? 'btn btn-cancel' : 'btn';
    btn.textContent = isTaken ? 'Cancelar' : 'Reservar';

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if(isTaken){
        cancelSlot(s.hour, btn, input);
      } else {
        input.disabled = true;
        input.classList.add('input-taken');
        btn.textContent = 'Cancelar';
        btn.classList.add('btn-cancel');
        btn.disabled = true;
        bookSlot(s.hour, input.value.trim(), btn, input);
      }
    });

    form.appendChild(input);
    form.appendChild(btn);
    body.appendChild(form);

    line.appendChild(body);
    composerSlots.appendChild(line);
  });
}

async function bookSlot(hour, name, btn, input){
  if(!name){
    composerNotice.textContent = 'Escribí un nombre antes de reservar.';
    composerNotice.classList.add('show');
    input.disabled = false;
    input.classList.remove('input-taken');
    btn.disabled = false;
    btn.textContent = 'Reservar';
    btn.classList.remove('btn-cancel');
    return;
  }
  composerNotice.classList.remove('show');
  btn.textContent = 'Guardando…';

  if(!supabaseClient){
    composerNotice.textContent = 'Faltan configurar las claves de Supabase en el archivo (arriba en el <script>).';
    composerNotice.classList.add('show');
    input.disabled = false;
    input.classList.remove('input-taken');
    btn.disabled = false;
    btn.textContent = 'Reservar';
    btn.classList.remove('btn-cancel');
    return;
  }

  try{
    const { error } = await supabaseClient
      .from('bookings')
      .insert({ date: selectedISO, hour, name });

    if(error){
      composerNotice.textContent = (error.code === '23505')
        ? 'Ese turno ya fue reservado por otra persona.'
        : 'No se pudo guardar. Probá de nuevo.';
      composerNotice.classList.add('show');
      monthData = await fetchMonthObj(viewYear, viewMonth);
      renderComposerSlots();
      renderMonth();
      return;
    }

    monthData = await fetchMonthObj(viewYear, viewMonth);
    renderComposerSlots();
    renderMonth();
  }catch(err){
    composerNotice.textContent = 'No se pudo guardar. Probá de nuevo.';
    composerNotice.classList.add('show');
    input.disabled = false;
    input.classList.remove('input-taken');
    btn.disabled = false;
    btn.textContent = 'Reservar';
    btn.classList.remove('btn-cancel');
  }
}

async function cancelSlot(hour, btn, input){
  const ok = window.confirm('¿Cancelar este turno y dejarlo libre?');
  if(!ok) return;

  composerNotice.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Cancelando…';

  if(!supabaseClient){
    composerNotice.textContent = 'Faltan configurar las claves de Supabase en el archivo (arriba en el <script>).';
    composerNotice.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Cancelar';
    return;
  }

  try{
    const { error } = await supabaseClient
      .from('bookings')
      .delete()
      .eq('date', selectedISO)
      .eq('hour', hour);

    if(error){
      composerNotice.textContent = 'No se pudo cancelar. Probá de nuevo.';
      composerNotice.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Cancelar';
      return;
    }
    monthData = await fetchMonthObj(viewYear, viewMonth);
    renderComposerSlots();
    renderMonth();
  }catch(err){
    composerNotice.textContent = 'No se pudo cancelar. Probá de nuevo.';
    composerNotice.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Cancelar';
  }
}

closeComposer.addEventListener('click', () => {
  composer.classList.remove('show');
  selectedISO = null;
  renderMonth();
});

prevBtn.addEventListener('click', () => {
  viewMonth -= 1;
  if(viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
  loadMonth();
});
nextBtn.addEventListener('click', () => {
  viewMonth += 1;
  if(viewMonth > 11){ viewMonth = 0; viewYear += 1; }
  loadMonth();
});

loadMonth();
</script>
</body>
</html>
